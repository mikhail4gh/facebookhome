<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACEBOOK LOGIN PAGE</title>
</head>
<body>
    <div class="whole-container" style="width: 100%; display: flex; height: 100vh; background-color: white;">
       <div class="first-container" style="width: 60%; height: 100%; background-color: white; display: flex;" >
           <div class="first-small-container" style="background-color: white; width: 35%; height: 100%;">
              <img src="FACEBOOK LOGO.jpeg" alt="Facebook Logo" style="width: 50px; height: auto; margin-top: 10px; padding-left: 25px;">
              <h1 style="color: black; font-size: 52px; font-weight: bold; margin-top: 180px;font-family: Arial, Helvetica, sans-serif; margin-left: 25px;"> 
              Explore<br> the<br> things<br> <span style=" color: royalblue;"> you love</span>.
              </h1>
           </div>
           <div class="first-other-container" style="width: 65%; overflow: hidden;">
               <img src="FACEBOOK_PICTURE-removebg-preview.png" alt="PICTURE COLLAGE" style="width: 100%; padding-top: 30px;">
           </div>
       </div>
   
        <div class="second-container" style="width: 40%; height: 100vh; background-color: white; display: flex; align-items: center; flex-direction: column; border-left: 1px solid gray;">
            <div class="profile-picture-name" style="background-color:black; width: 100px; height: 100px; border-radius: 100%; overflow: hidden; margin-top: 80px;">
              <img src="javokhir.jpg" alt="profile picture" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <p style="font-size: 20px;"> Javokhir Sindarov</p>
            <div style="background-color: white; width: 80%; height: 60vh;"> 
                <button onclick="alert('YOU ARE LOGGED IN')" style="background-color: blue; color: white; width: 100%; padding-bottom: 15px; padding-top: 15px; border-radius: 20px; border: none;">Continue</button>
                <button style="background-color: whitesmoke; color: black; width: 100%; padding-bottom: 15px; padding-top: 15px; border-radius: 20px; margin-top: 10px; border-color: whitesmoke; border: none;">Use another profile</button>
                <button style="background-color: white; color: blue; width: 100%; padding-bottom: 15px; padding-top: 15px; border-radius: 20px; margin-top: 60px; border-color: blue; border-width: 1px;">Create new account</button>
                <img src="meta_logo-removebg-preview.png" alt="Meta Logo" style="width: 70px; margin-left: 155px;">
            </div>
            </div>
        </div>
    </div>
</body>
</html>
